version: 2.1

############################################################################

references:
  checkout_job_steps: &checkout_job_steps
    steps:
      - checkout
      - run:
          name: Cloning dependency repositories..
          command: |
            git clone -b master --single-branch https://${GITHUB_ACCESS_TOKEN}@github.com/Zimbra/zm-nexus.git ~/zm-nexus
            mkdir -p ~/.zcs-deps

      - persist_to_workspace:
          root: ..
          paths:
            - zm-migration-tools
            - zm-nexus
            - .zcs-deps

############################################################################

  build_job_steps: &build_job_steps
    steps:
      - attach_workspace:
          at: ..

      - run:
          name: Compiling required dependencies and creating artifacts
          command: |
            mkdir -p /home/build/.ant/lib
            sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ivy ant-contrib

            # Copy ivy jar where old Ant build expects it
            cp /usr/share/java/ivy.jar /home/build/.ant/lib/

            cd ../zm-migration-tools
            JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64 && export JAVA_HOME
        
            ant zmzimbratozimbramig

      - persist_to_workspace:
          root: ..
          paths:
            - zm-migration-tools/build
            - .zcs-deps

############################################################################

  publish_job_steps: &publish_job_steps
    steps:
      - attach_workspace:
          at: ..

      - run:
          name: Publishing zm-migration-tools jar to Nexus
          command: |
            sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y curl

            cd ../zm-migration-tools

            # Build artifact version
            GIT_TIMESTAMP=$(git log -1 --pretty=format:%at)
            ARTIFACT_VERSION=$(echo "$BUILD_RELEASE_NO" | cut -d'_' -f1)
            VERSION="${ARTIFACT_VERSION}.${GIT_TIMESTAMP}"

            echo "Preparing JAR for upload (version: $VERSION)"

            MODULE="zm-migration-tools"
            TARGET_DIR="$HOME/.zcs-deps/zimbra/$MODULE"
            mkdir -p "$TARGET_DIR"

            ORIGINAL_JAR=$(find build/jars -type f -name "*.jar" | head -n 1)

            if [ -z "$ORIGINAL_JAR" ]; then
              echo "No JAR found in build/jars!"
              exit 1
            fi

            FINAL_JAR="${MODULE}-${VERSION}.jar"
            mv "$ORIGINAL_JAR" "$TARGET_DIR/$FINAL_JAR"

            echo "Using JAR located at: $TARGET_DIR/$FINAL_JAR"

            export MODULE_LIST="$MODULE"

            echo "Calling Nexus publish script..."
            bash ~/zm-nexus/scripts/publish-jars-to-nexus.sh "$HOME/.zcs-deps/zimbra"

            echo "Publish completed"

############################################################################

jobs:
  checkout:
    working_directory: ~/zm-migration-tools
    shell: /bin/bash -eo pipefail
    docker:
      - image: $DOCKER_REGISTRY/zm-base-os:devcore-ubuntu-22.04
        auth:
          username: $DOCKER_USER
          password: $DOCKER_PASS
    resource_class: small
    <<: *checkout_job_steps

  build:
    working_directory: ~/zm-migration-tools
    shell: /bin/bash -eo pipefail
    docker:
      - image: $DOCKER_REGISTRY/zm-base-os:devcore-ubuntu-22.04
        auth:
          username: $DOCKER_USER
          password: $DOCKER_PASS
    resource_class: medium
    <<: *build_job_steps

  publish:
    working_directory: ~/zm-migration-tools
    shell: /bin/bash -eo pipefail
    circleci_ip_ranges: true
    docker:
      - image: $DOCKER_REGISTRY/zm-base-os:devcore-ubuntu-22.04
        auth:
          username: $DOCKER_USER
          password: $DOCKER_PASS
    resource_class: small
    <<: *publish_job_steps

############################################################################

workflows:
  version: 2
  main:
    jobs:
      - checkout:
          context:
            - docker-dev-registry
      - build:
          context:
            - build-info
            - docker-dev-registry
          requires:
            - checkout
      - publish:
          context:
            - docker-dev-registry
            - build-info
            - nexus-dev-artifactory
          requires:
            - build
          filters:
            branches:
              only:
                - ZCS-19365
